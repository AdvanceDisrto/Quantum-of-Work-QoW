name: Quantum of Work CI

on:
  push:
    branches:
      - main
      - review/v0.1-local-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-qow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run fourteen tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Generate and verify end-to-end QoW receipt
        run: PYTHONPATH=. python run_e2e.py
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qow-smoke-evidence
          path: |
            artifacts/smoke_report.json
            artifacts/receipts.json
            artifacts/qow_ipqr.png
          if-no-files-found: ignore
